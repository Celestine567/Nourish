<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  <!-- Load Elsie Font:  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&display=swap" rel="stylesheet">
   <!-- Load Open Sans:  -->
   <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Load Cream Cake Font:  -->
  <link href="https://fonts.cdnfonts.com/css/mervale-script" rel="stylesheet">          
  <!-- Load stylesheet:  -->
  <link rel="stylesheet" type="text/css" href="css.css">
</head>

<body class="product">
  <!-- Top sticky banner:  -->
  <header> 
    <div class="main-header">
    <div class="nav-left">
      <a>Menu</a>
      <a>Find us</a>
      <a>Catering</a>
  </div>
    <div class="logo">
      <a href="Homepage.html" title="nourish logo">Nourish</a>
    </div>
    <div class="nav-right">
      <img src="Assets/cart-purple.png" alt="cart-icon">
      <img src="Assets/profile-purple.png" alt="profile-icon">
    </div>
  </div>

    <div class="subheader">
      <div class="category-nav-sticky"></div>
        <nav class="category-navbar">
          <ul class="nav-pill">
            <div class="pill-indicator"></div>
            <li class="nav-item">Lattes</li>
            <li class="nav-item">Smoothie</li>
            <li class="nav-item">Juice</li>
            <li class="nav-item">Bowl</li>
            <li class="nav-item">Sweets</li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="search-section">
      <form role="search" class="search-box"> 
        <input type="search" placeholder="Type here"/>
        <button type="submit">
          <img src="Assets/Search.png" alt="search">
        </button>
      </form>
    </section>

    <div class="lattes-product">
      <h1>Lattes</h1>
    </div>
    <section class="menu">

      <div class="product-card">
          <img src="" alt="">
          <div class="product-details">
            <h2>Activated Charcoal Latte</h2>
            <p>$14.5</p>
          </div>
          <div class="add-button">
            <h3>Add</h3>
          </div>
        </div>

        <div class="product-card">
          <img src="" alt="">
          <div class="product-details">
            <h2>Beetroot Latte</h2>
            <p>$14.5</p>
          </div>
          <img src="Assets/cart-purple.png" alt="cart-icon">
          <div class="add-button">
            <h3>Add</h3>
          </div>
        </div>

        <div class="product-card">
          <img src="" alt="">
          <div class="product-details">
            <h2>Butterfly Pea Blue Matcha Latte</h2>
            <p>$14.5</p>
          <img src="Assets/cart-purple.png" alt="cart-icon">
          <div class="add-button">
            <h3>Add</h3>
          </div>
        </div>
        </div>

        <div class="product-card">
          <img src="" alt="">
          <div class="product-details">
            <h2>Matcha Latte</h2>
            <p>$14.5</p>
          </div>
          <img src="Assets/cart-purple.png" alt="cart-icon">
          <div class="add-button">
            <h3>Add</h3>
          </div>
        </div>

        <div class="product-card">
          <img src="" alt="">
          <div class="product-details">
            <h2>Sakura Cherry Blossom Latte</h2>
            <p>$14.5</p>
          </div>
          <img src="Assets/cart-purple.png" alt="cart-icon">
          <div class="add-button">
            <h3>Add</h3>
          </div>
        </div>
    </section>

  </main>
</body>
</html>
