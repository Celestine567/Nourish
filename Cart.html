<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <!-- Load Elsie Font:  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&display=swap" rel="stylesheet">
   <!-- Load Open Sans:  -->
   <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Load Cream Cake Font:  -->
  <link href="https://fonts.cdnfonts.com/css/mervale-script" rel="stylesheet">          
  <!-- Load stylesheet:  -->
  <link rel="stylesheet" type="text/css" href="css.css">
</head>
<body class="cart">
  <!-- Top sticky banner:  -->
  <header>
      <div class="main-header">
      <div class="nav-left">
        <a>Menu</a>
        <a>Find us</a>
        <a>Catering</a>
    </div>
      <div class="logo">
        <a href="Homepage.html" title="nourish logo">Nourish</a>
      </div>
      <div class="nav-right">
        <img src="Assets/cart-purple.png" alt="cart-icon">
        <img src="Assets/profile-purple.png" alt="profile-icon">
      </div>
    </div>
  </header>

  <main class="cart-page">
    <!-- Cart header section -->
    <section class="cart-header">
      <h1>The Shopping Cart</h1>
      <p>Total X Items</p>
      <span class="line-cart"></span>
    </section>

    <!-- Cart item container-->
    <!-- 1 -->
    <div class="cart-item">
      <img src="Assets/Butterfly Pea Blue Matcha Latte.webp" alt="Butterfly Pea Blue Matcha Latte">
      <div class="item-info">
        <h2>Butterfly Pea Blue Matcha Latte</h2>
        <div class="quantity-box">
          <button onclick="decrease('q1')">-</button>
          <span id="q1">1</span>
          <button onclick="increase('q1')">+</button>
        </div>
        <p>$8.00</p>
      </div>

      <button class="select-btn" onclick="toggleSelect(this)">
      </button>
    </div>

    <!-- 2 -->
    <div class="cart-item">
      <img src="Assets/smoothie.webp" alt="smoothie">
      <div class="item-info">
        <h2>Cleanest Green Smoothie</h2>
        <div class="quantity-box">
          <button onclick="decrease('q1')">-</button>
          <span id="q1">1</span>
          <button onclick="increase('q1')">+</button>
        </div>
        <p>$13.00</p>
      </div>

        <button class="select-btn" onclick="toggleSelect(this)">
        </button>
      </div>

      <!-- Summary -->
      <div class="summary">
        <div class="summary-row">
          <p>price</p>
          <P>$21.00</P>
        </div>

        <div class="summary-row">
          <p>GST</p>
          <P>$0.26</P>
        </div>
      </div>

      <!-- Total  -->
       <div class="total-row">
        <h2>Total</h2>
        <h2>$21.26</h2>
       </div>

       <!-- Button  -->
       <button class="place-order" onclick="openPopup()">
        Place Order
       </button>
  </main>

  <!-- Overlay card  -->
  <div class="popup-overlay" id="popup">
    <div class="popup-card">
      <h1>Payment Details</h1>

      <form>
        <div class="payment-input">
          <label>Name On Card</label>
          <input type="text" placeholder="Celestine Liu">
        </div>
  
        <div class="payment-input">
          <label>Card Number</label>
          <input type="text" id="card-number" inputmode="numeric" pattern="[0-9 ]+" placeholder="1234 1234 1234 1234">
        </div>
  
        <div class="row">
          <div class="payment-input">
            <label>CVV</label>
            <input type="text" id="security-code" inputmode="numeric" minlength="3" maxlength="4" pattern="[0-9]+" placeholder="123">
          </div>
  
          <div class="payment-input">
            <label>Expiry</label>
            <input type="text" id="expiry-date"  minlength="4" pattern="[0-9/]+" placeholder="MM/YY">
          </div> 
        </div>

        <div class="payment-input">
          <label>Address</label>
          <input type="text" id="street-address" placeholder="1234 Address St">
        </div>

        <div class="row">
          <div class="payment-input">
            <label>State</label>
            <select>
              <option value="">Select State</option>
              <option value="VIC">VIC</option>
              <option value="NSW">NSW</option>
              <option value="QLD">QLD</option>
              <option value="SA">SA</option>
              <option value="WA">WA</option>
              <option value="TAS">TAS</option>
              <option value="ACT">ACT</option>
              <option value="NT">NT</option>
            </select>
          </div>
  
          <div class="payment-input">
            <label>Postcode</label>
            <input type="text" inputmode="numeric" maxlength="4" pattern="[0-9]" placeholder="3000">
          </div> 
        </div>
      </form>

      <!-- Button  -->
      <button class="place-order">
        Place Order
       </button>

      

    </div>
  </div>
  <script>
    function increase(id){
      let qty = document.getElementById(id);
      let current = Number(qty.innerText);
      qty.innerText = current + 1;
    }

    function decrease(id){
      let qty = document.getElementById(id);
      let current = Number(qty.innerText);
      if(current > 1){
        qty.innerText = current - 1;
      }
    }

    function toggleSelect(button){
      button.classList.toggle('active');
    }

    function openPopup(){
      document.getElementById('popup').style.display = 'flex';
    }

    function closePopup(){
      document.getElementById('popup').style.display = 'none';
    }

  </script>
</body>
</html>
