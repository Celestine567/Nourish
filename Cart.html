<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <!-- Load Elsie Font:  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&display=swap" rel="stylesheet">
   <!-- Load Open Sans:  -->
   <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Load Cream Cake Font:  -->
  <link href="https://fonts.cdnfonts.com/css/mervale-script" rel="stylesheet">          
  <!-- Load stylesheet:  -->
  <link rel="stylesheet" type="text/css" href="css.css">
</head>
<body class="cart">
  <!-- Top sticky banner:  -->
  <header>
    <div class="main-header">
      <button class="dropdown" onclick="toggleMenu()">
        <img src="Assets/menu-purple.png">
      </button>
      <div class="nav-left">
        <a>Menu</a>
        <a>Find Us</a>
        <a>Catering</a>
      </div>
      <div class="logo">
        <a href="index.html" title="nourish logo">Nourish</a>
      </div>
      <div class="nav-right">
        <div class="cart-number">
          <a href="Cart.html">
            <img src="Assets/cart-purple.png" alt="cart-icon">
          </a>
          <span id="cart-badge"></span>
        </div>
        <img src="Assets/profile-purple.png" alt="profile-icon">
      </div>
    </div>
  </header>

  <main class="cart-page">
    <!-- Cart header section -->
    <section class="cart-header">
      <h1>The Shopping Cart</h1>
      <p id="item-count">Total 0 Items</p>
      <span class="line-cart"></span>
    </section>

    <!-- Cart item container-->
    <div id="cart-items-container"></div>
    <div id="empty-cart" style="display:none; text-align:center; padding: 40px 0;">
      <p>Your cart is empty</p>
      <a href="Product_list.html">Back to Menu</a>
    </div>

      <!-- Summary -->
      <div class="summary">
        <div class="summary-row">
          <p>price</p>
          <P id="subtotal">$0.00</P>
        </div>

        <div class="summary-row">
          <p>GST</p>
          <P id="gst">$0.26</P>
        </div>
      </div>

      <!-- Total  -->
       <div class="total-row">
        <h2>Total</h2>
        <h2 id="total">$0.00</h2>
       </div>

       <!-- Button  -->
       <button class="place-order" onclick="openPopup()">
        Place Order
       </button>
  </main>

  <!-- Popoup payment card  -->
  <div class="popup-overlay" id="popup">
    <div class="popup-card">
      <h1>Payment Details</h1>

      <form onsubmit="handlePayment(event)">
        <div class="payment-input">
          <label>Name On Card</label>
          <input type="text" placeholder="Celestine Liu" required>
        </div>
  
        <div class="payment-input">
          <label>Card Number</label>
          <input type="text" id="card-number" inputmode="numeric" pattern="[0-9 ]{16}" placeholder="1234 1234 1234 1234" required>
        </div>
  
        <div class="row">
          <div class="payment-input">
            <label>CVV</label>
            <input type="text" id="security-code" inputmode="numeric" minlength="3" maxlength="4" pattern="[0-9]+" placeholder="123" required>
          </div>
  
          <div class="payment-input">
            <label>Expiry</label>
            <input type="text" id="expiry-date"  minlength="4" pattern="[0-9]{2}/[0-9]{2}" placeholder="MM/YY" required>
          </div> 
        </div>

        <div class="payment-input">
          <label>Address</label>
          <input type="text" id="street-address" placeholder="1234 Address St" required>
        </div>

        <div class="row">
          <div class="payment-input">
            <label>State</label>
            <select>
              <option value="">Select State</option>
              <option value="VIC">VIC</option>
              <option value="NSW">NSW</option>
              <option value="QLD">QLD</option>
              <option value="SA">SA</option>
              <option value="WA">WA</option>
              <option value="TAS">TAS</option>
              <option value="ACT">ACT</option>
              <option value="NT">NT</option>
            </select>
          </div>
  
          <div class="payment-input">
            <label>Postcode</label>
            <input type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="3000" required>
          </div> 
        </div>

        <!-- button -->
        <button class="place-order-pay" type="submit">
          Place Order
        </button>
      </form>

    
  </div>
  <script src="shared.js"></script>
  <script src="Javascript.js"></script>
</body>
</html>
