<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <!-- Load Elsie Font:  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&display=swap" rel="stylesheet">
  <!-- Load Cream Cake Font:  -->
  <link href="https://fonts.cdnfonts.com/css/mervale-script" rel="stylesheet">          
  <!-- Load stylesheet:  -->
  <link rel="stylesheet" type="text/css" href="css.css">
</head>
<body class="product">
  <!-- Top sticky banner:  -->
  <header> 
    <div class="main-header">
    <div class="nav-left">
      <a>Menu</a>
      <a>Find us</a>
      <a>Catering</a>
  </div>
    <div class="logo">
      <a href="Homepage.html" title="nourish logo">Nourish</a>
    </div>
    <div class="nav-right">
      <a href="Cart.html">
        <img src="Assets/cart-white.png" alt="cart-icon">
      </a>
      <img src="Assets/profile-white.png" alt="profile-icon">
    </div>
  </div>

    <div class="Subheader">
      <div class="category-nav-sticky">
        <nav class="category-navbar">
          <ul class="nav-pill">
            <li class="nav-item">Lattes</li>
            <li class="nav-item">Smoothie</li>
            <li class="nav-item">Juice</li>
            <li class="nav-item">Bowl</li>
            <li class="nav-item">Sweets</li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="product-page">
    <div class="product-content">
      <div class="product-info">
        <h1>Beetroot Latte</h1>
        <h2>$7.00</h2>
        <p>Nourish is where healthy eating starts. We have a passion for bringing you the freshest salads.</p>
      </div>

      <div class="product-options">
        <div class="size">
          <h2>Size</h2>
          <div class="option-card">
            <label class="option">
              <input type="radio" name="size" value="small">
              Small<br> $7.00
            </label>
            <label class="option">
              <input type="radio" name="size" value="medium">
              Medium<br> $8.00
            </label>
            <label class="option">
              <input type="radio" name="size" value="large">
              Large<br> $9.00
            </label>
          </div>
        </div>
  
          <div class="milk">
            <h2>Milk</h2>
            <div class="option-card">
              <label class="option">
                <input type="radio" name="size" value="small">
                Regular<br> $0.00
              </label>
              <label class="option">
                <input type="radio" name="size" value="small">
                Oat<br> $0.50
              </label>
            </div>
          </div>
        </div>
      
      <div class="place-button">
        <a href="Cart.html">
          Place Order
        </a>
        <!-- price
        <div class="total-price">
          <p>$8.00</p>
        </div>-->
      </div>
    </div>
       

  <!-- Product Image -->
    <div class="product-images">
      <img src="Assets/Activated Charcoal Latte.tiff" alt=""> 
   </div>
  </main>

    <section class="image-slider">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
    </section>

</body>
