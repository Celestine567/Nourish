<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <!-- Load Elsie Font:  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&display=swap" rel="stylesheet">
  <!-- Load Cream Cake Font:  -->
  <link href="https://fonts.cdnfonts.com/css/mervale-script" rel="stylesheet">          
  <!-- Load stylesheet:  -->
  <link rel="stylesheet" type="text/css" href="css.css">
</head>
<body class="product">
  <!-- Top sticky banner:  -->
  <header> 
    <div class="main-header">
    <div class="nav-left">
      <a>Menu</a>
      <a>Find us</a>
      <a>Catering</a>
    </div>
    <div class="logo">
      <a href="Homepage.html" title="nourish logo">Nourish</a>
    </div>
    <div class="nav-right">
      <div class="cart-number">
        <a href="Cart.html">
          <img src="Assets/cart-white.png" alt="cart-icon">
        </a>
        <span id="cart-badge"></span>
      </div>
      <img src="Assets/profile-white.png" alt="profile-icon">
    </div>
  </div>

    <div class="subheader">
      <div class="category-nav-sticky">
        <nav class="category-navbar">
          <ul class="nav-pill">
            <li class="nav-item">Lattes</li>
            <li class="nav-item">Smoothie</li>
            <li class="nav-item">Juice</li>
            <li class="nav-item">Bowl</li>
            <li class="nav-item">Sweets</li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="product-page">
    <!-- Product Image -->
    <div class="product-images">
      <a class="arrow-btn" id="arrow-last">&#10094</a>
      <img src="Assets/Activated Charcoal Latte.png" alt="Activated Charcoal Latte"> 
      <a class="arrow-btn" id="arrow-last">&#10095</a>
   </div>

    <div class="product-content">
      <a href="Product_list.html" class="back-button">
        <img src="Assets/back.png" alt="back-icon">
      </a>
      <div class="product-info">
        <h1>Beetroot Latte</h1>
        <div class="price-row">
          <h2>$7.00</h2>
          <button class="plus-btn" onclick="addToCart(this,'q3')">+</button>
          <div class="quantity-box-list" id="qty-q3">
            <button onclick="decrease('q3')">-</button>
            <span id="q3">1</span>
            <button onclick="increase('q3')">+</button>
          </div>
        </div>
        

        <p>Nourish is where healthy eating starts. We have a passion for bringing you the freshest salads.</p>
      </div>

      <div class="product-options">
        <div class="size">
          <h2>Size</h2>
          <div class="option-card">
            <label class="option">
              <input type="radio" name="size" value="small" required>
              Small<br> $7.00
            </label>
            <label class="option">
              <input type="radio" name="size" value="medium" required>
              Medium<br> $8.00
            </label>
            <label class="option">
              <input type="radio" name="size" value="large" required>
              Large<br> $9.00
            </label>
          </div>
        </div>
  
          <div class="milk">
            <h2>Milk</h2>
            <div class="option-card">
              <label class="option">
                <input type="radio" name="milk" value="small" required>
                Regular<br> $0.00
              </label>
              <label class="option">
                <input type="radio" name="milk" value="small" required>
                Oat<br> $0.50
              </label>
            </div>
          </div>
        </div>


      <div class="place-button">
        <a href="Cart.html">
          View Cart
        </a>
      </div>
    
    </div>
       
  
  </main>

    <section class="image-slider">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
    </section>
  
    <script src="shared.js"></script>
    <script src="Javascript.js"></script>

</body>
</html>
